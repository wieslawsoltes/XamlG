name: Workspace browser gate diagnostics
on:
  push:
    branches: [diagnostics/workspace-browser-58901]
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: playground-report-*
          run-id: 38076950172
          github-token: ${{ github.token }}
          path: reports
      - name: Print completed shard assertions
        shell: python
        run: |
          import json, re
          from pathlib import Path
          def walk(suites):
              for suite in suites:
                  for spec in suite.get('specs', []):
                      for test in spec.get('tests', []):
                          if test.get('status') not in ('unexpected', 'flaky'): continue
                          print('FAIL:', spec.get('file'), spec.get('title'))
                          for result in test.get('results', []):
                              for error in result.get('errors', []): print(re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', error.get('message', ''))[:4200])
                  walk(suite.get('suites', []))
          for path in sorted(Path('reports').rglob('results.json')):
              data = json.loads(path.read_text())
              print('\nSHARD:', data.get('config', {}).get('shard'), json.dumps(data.get('stats')))
              print('GLOBAL:', json.dumps(data.get('errors', []))[:5000])
              walk(data.get('suites', []))
