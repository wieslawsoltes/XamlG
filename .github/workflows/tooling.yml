name: Tooling and host validation
on:
  push:
    branches: [main, feat/tooling-and-playground]
    paths: ['src/**', 'tests/**', 'tools/**', 'Directory.*', '.github/workflows/tooling.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tooling-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet test tests/XamlG.Tooling.Tests/XamlG.Tooling.Tests.csproj -c Release -p:NuGetAudit=false --logger 'trx;LogFileName=tooling.trx' --results-directory artifacts/tests
      - name: Validate optional implemented hosts
        run: |
          for project in src/XamlG.Workspaces/XamlG.Workspaces.csproj tools/XamlG.Cli/XamlG.Cli.csproj; do
            if [ -f "$project" ]; then dotnet build "$project" -c Release -p:NuGetAudit=false; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tooling-tests
          path: artifacts/tests
