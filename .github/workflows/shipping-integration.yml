name: Shipping loader and MSBuild integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shipping-${{ github.ref }}
  cancel-in-progress: true
jobs:
  input-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Execute real MSBuild input contracts in an isolated worktree
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/xamlg-msbuild" HEAD
          cd "$RUNNER_TEMP/xamlg-msbuild"
          python scripts/test-msbuild-inputs.py
      - name: Remove isolated worktree
        if: always()
        shell: bash
        run: git worktree remove "$RUNNER_TEMP/xamlg-msbuild"
