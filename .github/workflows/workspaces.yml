name: Solution workspaces
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'src/XamlG.ProjectSystem/**'
      - 'src/XamlG.Workspaces/**'
      - 'tools/XamlG.Playground/**'
      - 'tools/XamlG.Studio.Host/**'
      - 'tests/XamlG.Workspaces.Tests/**'
      - 'scripts/test-browser-studio.py'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/workspaces.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solution-workspaces-${{ github.ref }}
  cancel-in-progress: true
jobs:
  previous-failure-context:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/msbuild-solution-workspaces'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: solution-workspace-summary
          run-id: '38065140779'
          github-token: ${{ github.token }}
          path: prior-validation
      - name: Bounded diagnostics from previous validation
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('prior-validation')
          for report in sorted(root.rglob('*.trx')):
              tree = ET.parse(report)
              counters = tree.find('.//{http://microsoft.com/schemas/VisualStudio/TeamTest/2010}Counters')
              print(report.name, counters.attrib if counters is not None else 'No counters')
          budget = 24000
          for context in sorted(root.rglob('error-context.md')):
              print('\n---', context.parent.name, '---')
              lines = context.read_text(encoding='utf-8').splitlines()
              selected = set(range(min(12, len(lines))))
              for index, line in enumerate(lines):
                  if any(word in line.lower() for word in ('alert', 'msb10', 'error:', 'exception', 'invalid', 'failed', 'exit code')):
                      selected.update(range(max(0, index - 2), min(len(lines), index + 8)))
              text = '\n'.join(f'{index + 1}: {lines[index]}' for index in sorted(selected))
              text = text[:min(6000, budget)]
              print(text)
              budget -= len(text)
              if budget <= 0:
                  break
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture exact validation source
        run: |
          mkdir -p artifacts/workspace-source
          git rev-parse HEAD > artifacts/workspace-source/commit.txt
          git show -s --format=%P HEAD > artifacts/workspace-source/parents.txt
          git archive --format=tar.gz HEAD -o artifacts/workspace-source/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: solution-workspace-source
          path: artifacts/workspace-source
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native workspace regression tests
        run: dotnet test tests/XamlG.Workspaces.Tests/XamlG.Workspaces.Tests.csproj -c Release -p:NuGetAudit=false -warnaserror --logger trx --results-directory artifacts/workspaces/native
      - name: Build the actual SDK companion
        run: dotnet build tools/XamlG.Studio.Host/XamlG.Studio.Host.csproj -c Release -p:NuGetAudit=false -warnaserror
      - name: Prepare browser toolchain and pinned assets
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          cd tools/XamlG.Playground
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare-assets
          npx playwright install --with-deps chromium
      - name: Publish production browser application
        run: |
          dotnet publish tools/XamlG.Playground/XamlG.Playground.csproj -c Release -p:NuGetAudit=false -o artifacts/playground
          python scripts/prepare-pages.py --commit "${{ github.sha }}"
      - name: Browser solutions, persistence, trust, SDK builds and Roslyn evaluation
        working-directory: tools/XamlG.Playground
        env:
          PLAYGROUND_PAGES_PREVIEW: '1'
        run: python ../../scripts/test-browser-studio.py solution-workspace.spec.mjs
      - name: Include browser failure context in job logs
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          for context in sorted(Path('tools/XamlG.Playground/test-results').glob('*/error-context.md')):
              print(f'\n--- {context} ---\n', flush=True)
              print(context.read_text(encoding='utf-8')[:60000], flush=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solution-workspace-summary
          path: |
            artifacts/workspaces/native
            tools/XamlG.Playground/test-results/**/error-context.md
            tools/XamlG.Playground/test-results/**/test-failed-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solution-workspace-validation
          path: |
            artifacts/workspaces
            tools/XamlG.Playground/test-results
            tools/XamlG.Playground/playwright-report
          if-no-files-found: error
