name: Apply reviewed intelligent UI integration hooks once
on:
  pull_request:
    paths:
      - 'eng/apply-intelligent-ui-hooks.py'
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'wieslawsoltes/XamlG' && github.event.pull_request.number == 18 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/intelligent-ui'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply exact-match source hooks and publish a fast-forward commit
        shell: bash
        run: |
          python eng/apply-intelligent-ui-hooks.py
          git diff --check
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tools tests
          git commit -m 'feat: wire intelligent UI into Studio agents, lifecycle and MCP host'
          git push origin HEAD:refs/heads/codex/intelligent-ui
          git rev-parse HEAD
