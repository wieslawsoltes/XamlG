name: Cross-platform solution
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  solution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build all default solution projects
        run: dotnet build XamlG.slnx -c Release -p:NuGetAudit=false
      - name: Execute all default solution test projects
        run: dotnet test XamlG.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/solution-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solution-tests-${{ matrix.os }}
          path: artifacts/solution-tests
