name: Workspace browser gate diagnostics
on:
  push:
    branches: [diagnostics/workspace-browser-58901]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playground-validation
          run-id: 38070784803
          github-token: ${{ github.token }}
          path: evidence
      - name: Summarize assertion failures without logging request credentials
        shell: python
        run: |
          import json, re, zipfile
          from pathlib import Path
          for path in sorted(Path('evidence').rglob('trace.zip')):
              print('\nTRACE:', path)
              with zipfile.ZipFile(path) as archive:
                  for name in archive.namelist():
                      if not name.endswith('.trace'): continue
                      events = []
                      errors = []
                      for line in archive.read(name).splitlines():
                          try: event = json.loads(line)
                          except ValueError: continue
                          if event.get('type') == 'before':
                              events.append(str(event.get('title') or event.get('apiName') or event.get('method') or ''))
                          if event.get('error'):
                              error = event['error']
                              message = error.get('message', str(error)) if isinstance(error, dict) else str(error)
                              message = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', message)
                              errors.append(message[:2600])
                      if errors:
                          print('Entry:', name)
                          print('Last actions:', json.dumps(events[-14:]))
                          for error in dict.fromkeys(errors): print('ERROR:', error)
          for path in sorted(Path('evidence').rglob('error-context.md')):
              print('\nCONTEXT:', path)
              print(path.read_text(errors='replace')[:2400])
