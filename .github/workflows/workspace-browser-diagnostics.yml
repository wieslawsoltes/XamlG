name: Workspace browser gate diagnostics
on:
  push:
    branches: [diagnostics/workspace-browser-58901]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playground-validation
          run-id: 38070784803
          github-token: ${{ github.token }}
          path: evidence
      - name: Inspect layout constraints recorded by the failing scenario
        shell: python
        run: |
          import json, re, zipfile
          from pathlib import Path
          for path in Path('evidence').rglob('trace.zip'):
              if 'agent-layout' not in str(path): continue
              with zipfile.ZipFile(path) as archive:
                  printed = set()
                  def walk(value):
                      if isinstance(value, dict):
                          classes = value.get('class', '')
                          if isinstance(classes, str) and ('ad-layout' in classes or 'ad-panel' in classes or 'ad-anchorable-pane' in classes):
                              line = json.dumps({key: item for key, item in value.items() if key in ('class', 'style', 'aria-label')})
                              if line not in printed and len(printed) < 65: print('LAYOUT:', line); printed.add(line)
                          for child in value.values(): walk(child)
                      elif isinstance(value, list):
                          for child in value: walk(child)
                  for name in archive.namelist():
                      if name.endswith('.trace'):
                          for line in archive.read(name).splitlines():
                              try: event = json.loads(line)
                              except ValueError: continue
                              if event.get('type') == 'frame-snapshot': walk(event.get('snapshot', {}).get('html', []))
                      if name.endswith('.network'):
                          for line in archive.read(name).splitlines():
                              try: event = json.loads(line)
                              except ValueError: continue
                              resource = event.get('snapshot', {})
                              url = resource.get('request', {}).get('url', '')
                              if 'dockyard' not in url.lower() or not url.split('?')[0].endswith('.js'): continue
                              content = resource.get('response', {}).get('content', {})
                              sha = content.get('_sha1')
                              if not sha or 'resources/' + sha not in archive.namelist(): continue
                              text = archive.read('resources/' + sha).decode(errors='replace')
                              print('DOCKING SCRIPT:', url)
                              for keyword in ['gridTemplateColumns', 'DockMinWidth', 'DockWidth', 'ResizeObserver']:
                                  locations = [match.start() for match in re.finditer(re.escape(keyword), text)]
                                  for at in locations[:2]: print(keyword, text[max(0, at - 300):at + 1100])
