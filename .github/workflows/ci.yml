name: Build and test
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xamlg-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiler:
    name: Compiler and generated-code execution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build generator
        run: dotnet build src/XamlG.Generator/XamlG.Generator.csproj -c Release -p:NuGetAudit=false
      - name: Execute compiler regression suite
        run: dotnet test tests/XamlG.Tests/XamlG.Tests.csproj -c Release -p:NuGetAudit=false --logger 'trx;LogFileName=compiler.trx' --results-directory artifacts/tests
      - name: Validate generator packaging
        run: dotnet pack src/XamlG.Generator/XamlG.Generator.csproj -c Release --no-build -p:NuGetAudit=false -o artifacts/packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-validation
          path: artifacts/tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
