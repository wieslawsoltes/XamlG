name: Avalonia generated-code validation
on:
  push:
    branches: [main, feat/tooling-and-playground]
    paths: ['src/**', 'tests/XamlG.Avalonia.Tests/**', '.github/workflows/avalonia.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avalonia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet test tests/XamlG.Avalonia.Tests/XamlG.Avalonia.Tests.csproj -c Release -p:NuGetAudit=false --logger 'trx;LogFileName=avalonia.trx' --results-directory artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avalonia-tests
          path: artifacts/tests
