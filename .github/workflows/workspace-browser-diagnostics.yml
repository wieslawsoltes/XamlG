name: Workspace browser gate diagnostics
on:
  push:
    branches: [diagnostics/workspace-browser-58901]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: playground-validation
          run-id: 38070784803
          github-token: ${{ github.token }}
          path: evidence
      - name: Read bounding box results and nearby layout snapshots
        shell: python
        run: |
          import json, zipfile
          from pathlib import Path
          for path in Path('evidence').rglob('trace.zip'):
              if 'agent-layout' not in str(path): continue
              with zipfile.ZipFile(path) as archive:
                  for name in archive.namelist():
                      if not name.endswith('.trace'): continue
                      calls = {}
                      for line in archive.read(name).splitlines():
                          try: event = json.loads(line)
                          except ValueError: continue
                          if event.get('type') == 'before': calls[event.get('callId')] = event
                          if event.get('type') == 'after':
                              before = calls.get(event.get('callId'), {})
                              method = str(before.get('method', ''))
                              if method in ('boundingBox', 'setViewportSize'):
                                  print(name, method, before.get('params', {}), event.get('result', {}))
                          if event.get('type') == 'frame-snapshot':
                              snapshot = event.get('snapshot', {})
                              if snapshot.get('snapshotName', '').endswith('after@call@178'):
                                  print('Snapshot:', str(snapshot)[:2000])
