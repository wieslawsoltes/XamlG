name: Review workspace lifecycle
on:
  push:
    branches: [feat/msbuild-solution-workspaces]
    paths: [.github/workflows/workspace-lifecycle-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'wieslawsoltes/XamlG'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Display verified pending lifecycle changes without applying them
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, gzip, hashlib, json, subprocess, urllib.request
          from pathlib import Path
          url = 'https://api.github.com/repos/wieslawsoltes/XamlG/git/blobs/24d047021a456caa41bd518ab182d71135650953'
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + __import__('os').environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          patch = gzip.decompress(base64.b64decode(blob['content']))
          assert len(patch) < 200000
          assert hashlib.sha256(patch).hexdigest() == 'ebc2399d65cb4ea1f1431454a45d12f4185eaf7ff1e34b55eb0556808ed4746f'
          Path('workspace-close.patch').write_bytes(patch)
          print(patch.decode('utf-8'), flush=True)
          subprocess.run(['git', 'apply', '--check', 'workspace-close.patch'], check=True)
