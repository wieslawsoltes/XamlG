name: Compatibility validation inputs
on:
  push:
    paths: ['.github/workflows/compatibility-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: /tmp/compatibility-packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Resolve test dependencies
        run: |
          mkdir -p /tmp/compatibility-inputs
          cat > /tmp/compatibility-inputs/Inputs.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework></PropertyGroup><ItemGroup><PackageReference Include="Avalonia.Themes.Simple" Version="12.1.3" /><PackageReference Include="Moq" Version="4.20.72" /><PackageReference Include="System.Reactive" Version="6.0.1" /><PackageReference Include="System.Buffers" Version="4.5.1" /><PackageReference Include="System.Numerics.Vectors" Version="4.4.0" /></ItemGroup></Project>
          XML
          dotnet restore /tmp/compatibility-inputs/Inputs.csproj
          tar -czf /tmp/compatibility-packages.tar.gz -C /tmp compatibility-packages
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-package-cache
          compression-level: 0
          retention-days: 3
          path: /tmp/compatibility-packages.tar.gz
