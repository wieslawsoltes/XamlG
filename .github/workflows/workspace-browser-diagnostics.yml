name: Workspace browser gate diagnostics
on:
  push:
    branches: [diagnostics/workspace-browser-58901]
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 82fb45fb1edb199f98c54be3c4134cf6bc7c782f
          persist-credentials: false
      - name: Check prepared tests and remaining preview navigation
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          for path in sorted(Path('tools/XamlG.Playground/tests').glob('*.mjs')):
              subprocess.run(['node', '--check', str(path)], check=True)
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if any(value in line for value in ["locator('.file", 'locator(".file', "locator('.explorer", 'Restore draft', 'Export project', 'Manage C# files', 'Manage XAML resources']):
                      print(f'SELECTOR {path}:{number}: {line[:500]}')
          subprocess.run(['python', '-m', 'unittest', 'discover', '-s', 'scripts/tests', '-p', 'test_browser_studio.py'], check=True)
      - uses: actions/download-artifact@v4
        with:
          pattern: playground-report-*
          run-id: 38076950172
          github-token: ${{ github.token }}
          path: reports
      - name: Print completed shard assertions
        shell: python
        run: |
          import json, re
          from pathlib import Path
          def walk(suites):
              for suite in suites:
                  for spec in suite.get('specs', []):
                      for test in spec.get('tests', []):
                          if test.get('status') not in ('unexpected', 'flaky'): continue
                          print('FAIL:', spec.get('file'), spec.get('title'))
                          for result in test.get('results', []):
                              for error in result.get('errors', []): print(re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', error.get('message', ''))[:4200])
                  walk(suite.get('suites', []))
          for path in sorted(Path('reports').rglob('results.json')):
              data = json.loads(path.read_text())
              print('\nSHARD:', data.get('config', {}).get('shard'), json.dumps(data.get('stats')))
              print('GLOBAL:', json.dumps(data.get('errors', []))[:5000])
              walk(data.get('suites', []))
