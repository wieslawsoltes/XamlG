name: Workspace browser gate diagnostics
on:
  push:
    branches: [diagnostics/workspace-browser-58901]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c46f262f2063748e02162ae09482ee356c292160
          fetch-depth: 200
          persist-credentials: false
      - name: Merge without replacing either parent's work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git fetch --depth=200 origin prepared/workspace-browser-contracts-58901
          test "$(git rev-parse FETCH_HEAD)" = c692efb9e4e8b69acfe94d17904d92c1a92932fb
          git -c user.name='Wiesław Šoltés' -c user.email=wieslawsoltes@users.noreply.github.com merge --no-ff FETCH_HEAD -m 'Integrate browser gate repairs with validated compiler and IntelligentUI main'
          git diff --check HEAD^ HEAD
          python -m unittest discover -s scripts/tests -p test_browser_studio.py
          node --check tools/XamlG.Playground/tests/live-preview.mjs
          node --check tools/XamlG.Playground/tests/dock-documents.spec.mjs
          node --check tools/XamlG.Playground/tests/agent-layout.spec.mjs
          git diff --stat HEAD^ HEAD
          git push origin HEAD:refs/heads/prepared/workspace-browser-integrated
          git rev-parse HEAD HEAD^{tree}
