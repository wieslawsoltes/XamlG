name: Workspace and CLI validation
on:
  push:
    branches: [main, feat/tooling-and-playground]
    paths: ['src/**', 'tools/XamlG.Cli/**', 'tests/XamlG.Workspaces.Tests/**', '.github/workflows/workspaces.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspaces-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet test tests/XamlG.Workspaces.Tests/XamlG.Workspaces.Tests.csproj -c Release -p:NuGetAudit=false --logger 'trx;LogFileName=workspaces.trx' --results-directory artifacts/tests
      - run: dotnet build tools/XamlG.Cli/XamlG.Cli.csproj -c Release -p:NuGetAudit=false
      - name: Execute standalone CLI compilation and output inspection
        run: |
          dotnet run --project tools/XamlG.Cli -c Release --no-build -- compile --file tests/CliSmoke/View.xaml --code tests/CliSmoke/Model.cs --framework Portable --output artifacts/cli --emit-assembly artifacts/cli/View.dll
          dotnet run --project tools/XamlG.Cli -c Release --no-build -- inspect --file tests/CliSmoke/View.xaml --code tests/CliSmoke/Model.cs --framework Portable > artifacts/cli/inspection.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('artifacts/cli/inspection.json').read_text())
          assert data[0]['bound']['typeName']=='CliSmoke.View'
          assert Path('artifacts/cli/View.dll').stat().st_size>0
          assert list(Path('artifacts/cli').glob('*.xaml.g.cs'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-cli-validation
          path: |
            artifacts/tests
            artifacts/cli
