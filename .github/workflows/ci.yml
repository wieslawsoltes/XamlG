name: Build and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native and MSBuild (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Create an isolated validation worktree
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/xamlg-native" HEAD
          echo "VALIDATION_WORKTREE=$RUNNER_TEMP/xamlg-native" >> "$GITHUB_ENV"
      - name: Restore and build the complete native solution
        shell: bash
        run: |
          cd "$VALIDATION_WORKTREE"
          dotnet restore XamlG.slnx -p:NuGetAudit=false
          dotnet build XamlG.slnx -c Release --no-restore -warnaserror
      - name: Execute compiler, runtime, tooling, workspace, LSP and Avalonia tests
        shell: bash
        run: |
          cd "$VALIDATION_WORKTREE"
          dotnet test XamlG.slnx -c Release --no-build --logger trx --results-directory artifacts/native
      - name: Execute input normalization and unchanged-build fingerprint contracts
        if: ${{ !cancelled() && env.VALIDATION_WORKTREE != '' }}
        shell: bash
        run: |
          set -o pipefail
          cd "$VALIDATION_WORKTREE"
          mkdir -p artifacts/msbuild
          python scripts/test-msbuild-inputs.py 2>&1 | tee artifacts/msbuild/inputs.log
          python scripts/test-msbuild-fingerprint.py 2>&1 | tee artifacts/msbuild/fingerprints.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}
          path: |
            ${{ env.VALIDATION_WORKTREE }}/artifacts/native
            ${{ env.VALIDATION_WORKTREE }}/artifacts/msbuild
      - name: Verify source was not modified and remove this job's worktree
        if: ${{ always() && env.VALIDATION_WORKTREE != '' }}
        shell: bash
        run: |
          git -C "$VALIDATION_WORKTREE" diff --exit-code
          git -C "$VALIDATION_WORKTREE" diff --cached --exit-code
          git worktree remove "$VALIDATION_WORKTREE"
  source:
    name: Exact source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive source with independent commit, tree and content identities
        run: |
          mkdir -p artifacts/source
          git archive --format=tar.gz -o artifacts/source/source.tar.gz HEAD
          git rev-parse HEAD > artifacts/source/commit.txt
          git rev-parse HEAD^{tree} > artifacts/source/tree.txt
          git ls-tree -r HEAD > artifacts/source/files.txt
          (cd artifacts/source && sha256sum source.tar.gz > sha256.txt)
          python scripts/verify-workflow-inventory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-source
          retention-days: 7
          path: artifacts/source
          if-no-files-found: error
  performance:
    name: Compiler performance comparison
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_PROCESSOR_COUNT: 2
      BASELINE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect compiler and runtime changes
        id: changes
        run: |
          python3 - <<'PY'
          import os, subprocess
          paths = ['src/XamlG.Syntax', 'src/XamlG.Roslyn', 'src/XamlG.Compiler', 'src/XamlG.CSharp',
                   'src/XamlG.Frameworks', 'src/XamlG.Generator', 'src/XamlG.Runtime',
                   'tools/XamlG.PerformanceProbe', 'scripts/compare-fast-paths.py',
                   'scripts/compare-controlcatalog-compilers.py', 'scripts/verify-compiler-performance.py',
                   'scripts/test-compiler-performance-gates.py', '.github/workflows/ci.yml']
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASELINE_REF'], 'HEAD', '--', *paths], text=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run=' + str(bool(changed.strip())).lower() + '\n')
          print(changed)
          PY
      - uses: actions/setup-dotnet@v4
        if: steps.changes.outputs.run == 'true'
        with:
          dotnet-version: '10.0.401'
      - name: Compare parser allocation and runtime initialization against the PR baseline
        if: steps.changes.outputs.run == 'true'
        run: python3 scripts/compare-fast-paths.py --baseline-ref "$BASELINE_REF" --pairs 3
      - name: Prepare pinned catalog and compare generator and generated C# cost
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 scripts/prepare-controlcatalog.py
          python3 scripts/compare-controlcatalog-compilers.py --baseline-ref "$BASELINE_REF" --iterations 3
      - name: Enforce complete semantic and byte-identical generated-source evidence
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 scripts/test-compiler-performance-gates.py
          python3 scripts/verify-compiler-performance.py --baseline "$BASELINE_REF" --candidate "$(git rev-parse HEAD)" --require-identical-sources --workload-manifest tools/XamlG.PerformanceProbe/workloads.json
      - name: Publish measurements and generated-source identities
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summaries = []
          for directory in ['fast-path-comparison', 'controlcatalog-comparison']:
              path = Path('artifacts') / directory / 'summary.md'
              if path.exists(): summaries.append(path.read_text())
          path = Path('artifacts/controlcatalog-comparison/results.json')
          if path.exists():
              for project in json.loads(path.read_text())['projects']:
                  before, after = project['sources']['before'], project['sources']['after']
                  line = f"{project['project']}: generated source SHA256 maps equal = {before['sha256'] == after['sha256']}; files {before['files']} -> {after['files']}"
                  print(line)
                  summaries.append(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n\n'.join(summaries))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.changes.outputs.run == 'true' }}
        with:
          name: compiler-performance-comparison
          retention-days: 14
          path: |
            artifacts/fast-path-comparison
            artifacts/controlcatalog-comparison
