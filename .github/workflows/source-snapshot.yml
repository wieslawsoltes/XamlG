name: Source snapshot
on:
  push:
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Archive exact source revision and integrity
        run: |
          git archive --format=tar.gz -o /tmp/xamlg-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/source-commit.txt
          git ls-tree -r HEAD > /tmp/source-tree.txt
          sha256sum /tmp/xamlg-source.tar.gz > /tmp/source-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          retention-days: 7
          path: |
            /tmp/xamlg-source.tar.gz
            /tmp/source-commit.txt
            /tmp/source-tree.txt
            /tmp/source-sha256.txt
