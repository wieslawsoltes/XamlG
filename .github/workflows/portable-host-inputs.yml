name: Portable host validation inputs
on:
  push:
    paths: ['.github/workflows/portable-host-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: /tmp/xamlg-browser-packages
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve browser runtime and framework dependencies
        run: |
          mkdir -p /tmp/browser-inputs
          cat > /tmp/browser-inputs/Browser.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk.BlazorWebAssembly"><PropertyGroup><TargetFramework>net10.0</TargetFramework><RuntimeIdentifier>browser-wasm</RuntimeIdentifier><RunAOTCompilation>false</RunAOTCompilation></PropertyGroup><ItemGroup><PackageReference Include="Microsoft.AspNetCore.Components.WebAssembly" Version="10.0.12" /><PackageReference Include="Microsoft.AspNetCore.Components.WebAssembly.DevServer" Version="10.0.12" /><PackageReference Include="Avalonia.Browser" Version="12.1.3" /><PackageReference Include="Avalonia.Themes.Fluent" Version="12.1.3" /></ItemGroup></Project>
          XML
          dotnet restore /tmp/browser-inputs/Browser.csproj -p:NuGetAudit=false
          tar -czf /tmp/browser-packages.tar.gz -C /tmp xamlg-browser-packages
          tar -czf /tmp/native-host-pack.tar.gz -C "$DOTNET_ROOT" packs/Microsoft.NETCore.App.Host.linux-x64
          ls -lh /tmp/*tar.gz
      - name: Resolve editor and browser testing dependencies
        run: |
          mkdir -p /tmp/xamlg-web-inputs
          cd /tmp/xamlg-web-inputs
          npm init -y
          npm install --save-exact monaco-editor@latest @playwright/test@latest esbuild@latest
          npm ls --depth=0 > dependency-versions.txt
          tar -czf /tmp/web-inputs.tar.gz -C /tmp xamlg-web-inputs
      - uses: actions/upload-artifact@v4
        with:
          name: native-host-pack
          path: /tmp/native-host-pack.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: browser-runtime-inputs
          path: /tmp/browser-packages.tar.gz
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: web-editor-inputs
          path: /tmp/web-inputs.tar.gz
          compression-level: 0
          retention-days: 7
