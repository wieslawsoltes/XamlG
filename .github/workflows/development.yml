name: Compiler development validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/development.yml', '.bootstrap/patches/*.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xamlg-source-transactions
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded source transactions
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          manifests = sorted(root.glob('.bootstrap/patches/*.json'))
          for manifest in manifests:
              transaction = json.loads(manifest.read_text())
              pending = []
              for entry in transaction['files']:
                  relative = PurePosixPath(entry['path'])
                  if relative.is_absolute() or '..' in relative.parts or any(p in {'.git', '.github', '.bootstrap', 'bin', 'obj'} for p in relative.parts):
                      raise RuntimeError(f'Invalid source path: {relative}')
                  target = root / relative
                  old = subprocess.check_output(['git', 'hash-object', str(target)], text=True).strip() if target.is_file() else None
                  content = entry.get('content')
                  if 'replacements' in entry:
                      if not entry.get('previous') or old != entry['previous']:
                          raise RuntimeError(f'Concurrent modification of {relative}: {old}')
                      content = target.read_text()
                      for replacement in entry['replacements']:
                          if not replacement['old'] or content.count(replacement['old']) != 1:
                              raise RuntimeError(f'Replacement in {relative} must match exactly once')
                          content = content.replace(replacement['old'], replacement['new'], 1)
                  new = subprocess.check_output(['git', 'hash-object', '--stdin'], input=content, text=True).strip() if content is not None else None
                  if old != entry.get('previous') and old != new:
                      raise RuntimeError(f'Concurrent modification of {relative}: {old}')
                  pending.append((target, content))
              for target, content in pending:
                  if content is None:
                      target.unlink(missing_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_text(content, encoding='utf8', newline='')
              subprocess.run(['git', 'rm', '--', str(manifest.relative_to(root))], check=True)
              subprocess.run(['git', 'add', '--all'], check=True)
              if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
                  subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', transaction['message']], check=True)
          if manifests:
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          print('SOURCE_COMMIT=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip())
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build compiler and implemented hosts
        run: |
          dotnet build src/XamlG.Compiler/XamlG.Compiler.csproj -c Release -p:NuGetAudit=false
          for project in src/XamlG.Generator/XamlG.Generator.csproj src/XamlG.Workspaces/XamlG.Workspaces.csproj tools/XamlG.Cli/XamlG.Cli.csproj; do
            if [ -f "$project" ]; then dotnet build "$project" -c Release -p:NuGetAudit=false; fi
          done
      - name: Execute compiler tests
        run: dotnet test tests/XamlG.Tests/XamlG.Tests.csproj -c Release -p:NuGetAudit=false --logger 'trx;LogFileName=compiler.trx' --results-directory artifacts/tests
      - name: Execute Avalonia integration tests
        if: ${{ hashFiles('tests/XamlG.Avalonia.Tests/XamlG.Avalonia.Tests.csproj') != '' }}
        run: dotnet test tests/XamlG.Avalonia.Tests/XamlG.Avalonia.Tests.csproj -c Release -p:NuGetAudit=false --logger 'trx;LogFileName=avalonia.trx' --results-directory artifacts/tests
      - name: Build browser playground
        if: ${{ hashFiles('tools/XamlG.Playground/XamlG.Playground.csproj') != '' }}
        run: dotnet publish tools/XamlG.Playground/XamlG.Playground.csproj -c Release -p:NuGetAudit=false -o artifacts/playground
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-validation
          path: artifacts/tests
          if-no-files-found: ignore
          retention-days: 14
