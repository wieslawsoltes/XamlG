<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Intelligent Avalonia UI</title>
<style>
:root{color-scheme:light dark;font-family:var(--font-sans,system-ui,sans-serif);font-size:14px}body{margin:0;padding:12px;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText)}button,input,textarea{font:inherit;max-width:100%;box-sizing:border-box}button{padding:6px 12px;cursor:pointer}button:disabled{cursor:default;opacity:.65}.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}.toolbar span{flex:1;font-size:12px;opacity:.8}.error{white-space:pre-wrap;color:var(--color-text-danger,#b42318)}#surface{overflow:auto;max-height:1600px}#review{margin:12px 0;padding:12px;border:1px solid Gray;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:12px}.node{box-sizing:border-box;min-width:0}.label{display:flex;gap:8px;align-items:center}.label input{flex:none}textarea{resize:vertical}.grid{display:grid}.stack{display:flex;flex-direction:column}.text{white-space:pre-wrap}.hidden,[hidden]{display:none!important}
</style></head><body>
<div class="toolbar"><span id="status" role="status">Connecting to the host…</span><button id="refresh" disabled>Refresh</button></div>
<div id="error" class="error" role="alert"></div><main id="surface" aria-label="Interactive Avalonia UI"></main>
<section id="review" hidden aria-label="Review UI action"><strong>Review action</strong><pre id="intent"></pre><p>Confirmation requests this action through the host. Existing tool permissions still apply.</p><button id="confirm">Confirm</button> <button id="cancel">Cancel</button></section>
<details><summary>Text fallback</summary><pre id="fallback"></pre></details>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id), root = $('surface');
  const pending = new Map(), entries = new Map();
  const types = new Set(['StackPanel','Grid','Border','TextBlock','Button','TextBox','Slider','CheckBox','ProgressBar','Separator','ScrollViewer']);
  let nextId=0, origin=null, ready=false, disposed=false, capabilities={}, snapshot=null, marker=null, queued=null, busy=false, review=null, refreshing=false, refreshAgain=false, subscribed=null;
  const status = text => { $('status').textContent=text; };
  const error = value => { $('error').textContent=String(value?.message??value??'').slice(0,4096); };
  const post = message => { if(!disposed) parent.postMessage(message,origin&&origin!=='null'?origin:'*'); };
  function notify(method,params){post({jsonrpc:'2.0',method,params});}
  function request(method,params){
    if(disposed||pending.size>=16)return Promise.reject(new Error('UI request limit reached.'));
    const id=++nextId;
    return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error('The host request timed out.'));},30000);pending.set(id,{resolve,reject,timer,method});post({jsonrpc:'2.0',id,method,params});});
  }
  function tool(name,args){
    if(!ready||!capabilities.serverTools)throw new Error('This host does not allow UI tool calls. Use the text fallback.');
    return request('tools/call',{name,arguments:args}).then(result=>{
      if(result.isError)throw new Error(result.content?.filter(x=>x.type==='text').map(x=>x.text).join('\n')||'Tool invocation failed.');
      if(result.structuredContent!==undefined)return result.structuredContent;
      const text=result.content?.find(x=>x.type==='text')?.text;
      if(typeof text!=='string'||text.length>2097152)throw new Error('The host returned no bounded structured result.');
      return JSON.parse(text);
    });
  }
  function validSnapshot(value){
    if(!value||typeof value.id!=='string'||value.id.length>80||typeof value.sessionId!=='string'||value.sessionId.length!==32||!Number.isSafeInteger(value.revision)||!Number.isSafeInteger(value.stateRevision)||!Array.isArray(value.roots))throw new Error('Invalid UI snapshot.');
    if(marker&&(value.id!==marker.id||value.sessionId!==marker.sessionId))throw new Error('This UI session was released or replaced.');
    const seen=new Set();let count=0;
    function check(node,depth){
      if(++count>4096||depth>48||!types.has(node.type)||typeof node.key!=='string'||node.key.length>8192||seen.has(node.key)||!Array.isArray(node.children)||!node.properties||typeof node.properties!=='object')throw new Error('Invalid component tree.');
      seen.add(node.key);
      for(const [name,v] of Object.entries(node.properties))if(name.length>80||!['string','number','boolean'].includes(typeof v)||typeof v==='string'&&v.length>16384||typeof v==='number'&&!Number.isFinite(v))throw new Error('Invalid component property.');
      for(const child of node.children)check(child,depth+1);
    }
    for(const node of value.roots)check(node,0);
  }
  function accept(value){
    validSnapshot(value);
    if(snapshot&&snapshot.sessionId===value.sessionId&&(value.revision<snapshot.revision||value.revision===snapshot.revision&&value.stateRevision<snapshot.stateRevision))return;
    snapshot=value;review=null;$('review').hidden=true;
    const used=new Set();
    function render(node,disabled=false,hidden=false){
      const p=node.properties;disabled=disabled||p.IsEnabled===false;hidden=hidden||p.IsVisible===false;
      let entry=entries.get(node.key);
      if(entry&&entry.type!==node.type){entry.element.remove();entries.delete(node.key);entry=null;}
      if(!entry){entry=create(node);entries.set(node.key,entry);}
      entry.node=node;entry.disabled=disabled;used.add(node.key);
      const e=entry.element;e.className='node';e.style.cssText='';e.hidden=hidden;
      common(e,p);
      if(entry.input){entry.input.disabled=disabled||busy;entry.input.setAttribute('aria-label',p.PlaceholderText||p.Content||node.stateKey||node.key);}
      switch(node.type){
        case 'StackPanel':e.classList.add('stack');e.style.flexDirection=p.Orientation==='Horizontal'?'row':'column';e.style.gap=px(p.Spacing,0,128);break;
        case 'Grid':e.classList.add('grid');e.style.gridTemplateColumns=tracks(p.ColumnDefinitions||'*');e.style.gridTemplateRows=tracks(p.RowDefinitions||'*');break;
        case 'Border':e.style.padding=px(p.Padding,0,128);e.style.borderRadius=px(p.CornerRadius,0,128);e.style.borderStyle='solid';e.style.borderWidth=px(p.BorderThickness,0,16);if(p.BorderBrush)e.style.borderColor=color(p.BorderBrush);if(p.Background)e.style.background=color(p.Background);break;
        case 'TextBlock':e.classList.add('text');e.textContent=p.Text||'';if(p.FontSize)e.style.fontSize=px(p.FontSize,8,96);e.style.fontWeight=({Normal:'400',Medium:'500',SemiBold:'600',Bold:'700'})[p.FontWeight]||'400';if(p.Foreground)e.style.color=color(p.Foreground);e.style.whiteSpace=p.TextWrapping==='Wrap'?'pre-wrap':'pre';break;
        case 'Button':e.textContent=p.Content||'Action';e.disabled=disabled||busy||!node.actionId;break;
        case 'TextBox':entry.input.value=p.Text||'';entry.input.placeholder=p.PlaceholderText||'';entry.input.maxLength=integer(p.MaxLength??16384,1,16384);entry.input.rows=p.AcceptsReturn?3:1;break;
        case 'Slider':entry.input.min=String(number(p.Minimum??0,-1000000,1000000));entry.input.max=String(number(p.Maximum??100,-1000000,1000000));entry.input.step=p.IsSnapToTickEnabled?String(number(p.TickFrequency??1,.001,1000000)):'any';entry.input.value=String(p.Value??0);break;
        case 'CheckBox':entry.input.checked=p.IsChecked===true;entry.caption.textContent=p.Content||'';e.classList.add('label');break;
        case 'ProgressBar':e.max=number((p.Maximum??100)-(p.Minimum??0),.000001,2000000);if(p.IsIndeterminate)e.removeAttribute('value');else e.value=number((p.Value??0)-(p.Minimum??0),0,2000000);break;
        case 'ScrollViewer':e.style.overflow='auto';e.style.maxHeight='600px';break;
      }
      const children=node.children.map(child=>render(child,disabled,hidden));
      if(['StackPanel','Grid','Border','ScrollViewer'].includes(node.type))reconcile(e,children);
      return e;
    }
    reconcile(root,value.roots.map(node=>render(node)));
    for(const [key,entry]of entries)if(!used.has(key)){entry.element.remove();entries.delete(key);}
    $('fallback').textContent=String(value.fallbackMarkdown||'').slice(0,131072);
    status((value.isFinal?'Interactive UI':'Streaming UI')+' · revision '+value.revision+' · state '+value.stateRevision);
    $('refresh').disabled=busy||!capabilities.serverTools;
  }
  function reconcile(parent,children){
    const wanted=new Set(children);for(const child of [...parent.children])if(!wanted.has(child))child.remove();
    children.forEach((child,index)=>{if(parent.children[index]!==child)parent.insertBefore(child,parent.children[index]||null);});
  }
  function create(node){
    let e,input=null,caption=null;
    switch(node.type){
      case 'Button':e=document.createElement('button');e.type='button';break;
      case 'TextBox':e=input=document.createElement('textarea');break;
      case 'Slider':e=input=document.createElement('input');input.type='range';break;
      case 'CheckBox':e=document.createElement('label');input=document.createElement('input');input.type='checkbox';caption=document.createElement('span');e.append(input,caption);break;
      case 'ProgressBar':e=document.createElement('progress');break;
      case 'Separator':e=document.createElement('hr');break;
      default:e=document.createElement('div');
    }
    const entry={element:e,input,caption,type:node.type,node,disabled:false};
    if(input)input.addEventListener('change',()=>changeState(entry));
    if(node.type==='Button')e.addEventListener('click',()=>prepare(entry));
    return entry;
  }
  function number(v,min,max){if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max)throw new Error('Numeric UI value is out of bounds.');return v;}
  function integer(v,min,max){number(v,min,max);if(!Number.isInteger(v))throw new Error('Integer UI value required.');return v;}
  function px(v,min,max){return String(number(v??0,min,max))+'px';}
  function color(v){if(/^#[0-9a-f]{8}$/i.test(v))return '#'+v.slice(3)+v.slice(1,3);if(/^#[0-9a-f]{6}$/i.test(v)||/^(Transparent|Black|White|Gray|Red|Green|Blue)$/.test(v))return v;throw new Error('Color is not in the catalog.');}
  function tracks(v){const parts=String(v).split(',');if(parts.length>64)throw new Error('Too many grid tracks.');return parts.map(raw=>{const text=raw.trim();if(text==='Auto')return 'auto';if(text==='*')return '1fr';const star=text.endsWith('*'),n=Number(star?text.slice(0,-1):text);return String(number(n,0,10000))+(star?'fr':'px');}).join(' ');}
  function common(e,p){
    for(const [name,css]of [['Width','width'],['Height','height'],['MinWidth','minWidth'],['MinHeight','minHeight'],['MaxWidth','maxWidth'],['MaxHeight','maxHeight']])if(p[name]!==undefined)e.style[css]=px(p[name],0,10000);
    if(p.Margin!==undefined)e.style.margin=px(p.Margin,0,128);
    const h=({Left:'start',Center:'center',Right:'end',Stretch:'stretch'})[p.HorizontalAlignment];if(h)e.style.justifySelf=h;
    const v=({Top:'start',Center:'center',Bottom:'end',Stretch:'stretch'})[p.VerticalAlignment];if(v)e.style.alignSelf=v;
    if(p['Grid.Row']!==undefined||p['Grid.RowSpan']!==undefined)e.style.gridRow=String(integer(p['Grid.Row']??0,0,64)+1)+' / span '+integer(p['Grid.RowSpan']??1,1,64);
    if(p['Grid.Column']!==undefined||p['Grid.ColumnSpan']!==undefined)e.style.gridColumn=String(integer(p['Grid.Column']??0,0,64)+1)+' / span '+integer(p['Grid.ColumnSpan']??1,1,64);
  }
  async function changeState(entry){
    if(busy||!snapshot||entry.disabled||!entry.node.stateKey)return;
    const value=entry.type==='CheckBox'?entry.input.checked:entry.type==='Slider'?Number(entry.input.value):entry.input.value;
    const args={id:snapshot.id,expectedRevision:snapshot.revision,expectedStateRevision:snapshot.stateRevision,key:entry.node.stateKey,value};
    busy=true;error('');
    try{
      const result=await tool('xamlg_ui_state',args);busy=false;accept(result);
      if(capabilities.updateModelContext)await request('ui/update-model-context',{structuredContent:{surfaceId:result.id,sessionId:result.sessionId,revision:result.revision,stateRevision:result.stateRevision,state:result.state}});
    }catch(e){busy=false;error(e);await refresh();}finally{busy=false;}
  }
  async function prepare(entry){
    if(busy||entry.disabled||!snapshot)return;
    const call={id:snapshot.id,expectedRevision:snapshot.revision,expectedStateRevision:snapshot.stateRevision,nodeKey:entry.node.key};
    busy=true;error('');try{const intent=await tool('xamlg_ui_action',call);review={call,intent};$('intent').textContent=JSON.stringify(intent,null,2);$('review').hidden=false;}catch(e){error(e);}finally{busy=false;}
  }
  async function confirm(){
    if(busy||!review)return;const current=review;busy=true;$('confirm').disabled=true;error('');
    try{
      const intent=await tool('xamlg_ui_action',current.call);
      if(JSON.stringify(intent)!==JSON.stringify(current.intent))throw new Error('The action changed. Review it again.');
      switch(intent.kind){
        case 'tool':await tool(intent.tool,intent.arguments||{});break;
        case 'message':if(!capabilities.message)throw new Error('This host does not support follow-up messages.');await request('ui/message',{role:'user',content:[{type:'text',text:intent.text}]});break;
        case 'openUrl':{if(!capabilities.openLinks)throw new Error('This host does not support opening links.');const url=new URL(intent.text);if(!['https:','http:'].includes(url.protocol)||url.username||url.password)throw new Error('Unsupported URL.');await request('ui/open-link',{url:url.href});break;}
        case 'copy':if(!navigator.clipboard)throw new Error('Clipboard is unavailable. Select the text in this review to copy it.');await navigator.clipboard.writeText(intent.text);break;
        default:throw new Error('Unsupported action.');
      }
      review=null;$('review').hidden=true;status('Action completed.');
    }catch(e){error(e);}finally{busy=false;$('confirm').disabled=false;}
  }
  async function refresh(){
    if(!ready||!marker||disposed)return;
    if(refreshing){refreshAgain=true;return;}refreshing=true;
    try{do{refreshAgain=false;const result=await tool('xamlg_ui_read',{id:marker.id});accept(result);}while(refreshAgain&&!disposed);}
    catch(e){error(e);if(String(e.message).includes('replaced')||String(e.message).includes('no longer available')){root.replaceChildren();entries.clear();snapshot=null;}}
    finally{refreshing=false;}
  }
  async function receiveResult(result){
    if(!ready){queued=result;return;}
    const value=result?.structuredContent;
    if(result?.isError){error(result.content?.find(x=>x.type==='text')?.text||'The tool failed.');return;}
    if(value?.format==='xamlg.intelligent-ui/1'){
      if(marker&&(marker.id!==value.id||marker.sessionId!==value.sessionId)){error('This card belongs to a different UI session.');return;}
      marker=value;$('fallback').textContent=String(value.fallbackMarkdown||'').slice(0,131072);
      await refresh();
      if(capabilities.serverResources?.subscribe&&subscribed!==value.id){subscribed=value.id;request('resources/subscribe',{uri:'xamlg://ui/'+encodeURIComponent(value.id)}).catch(()=>{});}
    }else if(value?.roots&&marker){accept(value);}
    else if(!snapshot)$('fallback').textContent=(result?.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n').slice(0,131072);
  }
  function context(value){if(!value||typeof value!=='object')return;if(value.theme==='dark'||value.theme==='light')document.documentElement.style.colorScheme=value.theme;}
  function teardown(){if(disposed)return;disposed=true;for(const p of pending.values()){clearTimeout(p.timer);p.reject(new Error('UI was disposed.'));}pending.clear();window.removeEventListener('message',onMessage);resize.disconnect();entries.clear();root.replaceChildren();snapshot=null;review=null;}
  function onMessage(event){
    if(disposed||event.source!==parent||!event.data||event.data.jsonrpc!=='2.0')return;
    const m=event.data;
    if(origin!==null&&event.origin!==origin)return;
    if(m.id!==undefined&&(m.result!==undefined||m.error!==undefined)){
      const p=pending.get(m.id);if(!p)return;
      if(origin===null){if(p.method!=='ui/initialize')return;origin=event.origin;}
      clearTimeout(p.timer);pending.delete(m.id);if(m.error)p.reject(new Error(m.error.message||'Host rejected the request.'));else p.resolve(m.result);return;
    }
    if(!ready||origin===null)return;
    if(m.id!==undefined){
      if(m.method==='ui/resource-teardown'){post({jsonrpc:'2.0',id:m.id,result:{}});teardown();return;}
      if(m.method==='ping'){post({jsonrpc:'2.0',id:m.id,result:{}});return;}
      post({jsonrpc:'2.0',id:m.id,error:{code:-32601,message:'Unsupported UI request'}});return;
    }
    if(m.method==='ui/notifications/tool-result')receiveResult(m.params).catch(error);
    else if(m.method==='ui/notifications/host-context-changed')context(m.params);
    else if(m.method==='notifications/resources/updated'&&marker&&m.params?.uri==='xamlg://ui/'+encodeURIComponent(marker.id))refresh();
    else if(m.method==='ui/notifications/tool-input-partial')status('Receiving UI update…');
    else if(m.method==='ui/notifications/tool-cancelled')status('UI update cancelled. The last committed view is retained.');
  }
  const resize=new ResizeObserver(()=>{if(ready)notify('ui/notifications/size-changed',{height:Math.min(2000,Math.max(100,Math.ceil(document.body.scrollHeight)))});});resize.observe(document.body);
  $('refresh').addEventListener('click',()=>{error('');refresh();});$('confirm').addEventListener('click',confirm);$('cancel').addEventListener('click',()=>{review=null;$('review').hidden=true;});
  window.addEventListener('message',onMessage);window.addEventListener('pagehide',teardown,{once:true});
  request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'XamlG Intelligent UI',version:'0.1.0'},appCapabilities:{}}).then(result=>{
    if(result.protocolVersion!=='2026-01-26')throw new Error('The host selected an unsupported MCP Apps protocol version.');
    capabilities=result.hostCapabilities||{};ready=true;context(result.hostContext);notify('ui/notifications/initialized',{});status('Waiting for a UI tool result.');$('refresh').disabled=!capabilities.serverTools;
    if(queued){const latest=queued;queued=null;return receiveResult(latest);}
  }).catch(error);
})();
</script></body></html>
