name: Host validation inputs
on:
  push:
    paths: ['.github/workflows/host-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: /tmp/host-packages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Resolve host packages
        run: |
          mkdir -p /tmp/host-inputs
          cat > /tmp/host-inputs/Hosts.csproj <<'XML'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0</TargetFramework><OutputType>Exe</OutputType><RuntimeIdentifier>linux-x64</RuntimeIdentifier><SelfContained>false</SelfContained></PropertyGroup><ItemGroup><PackageReference Include="xunit.v3" Version="3.2.2" /><PackageReference Include="Avalonia.Browser" Version="12.1.3" /><PackageReference Include="Avalonia.Headless.XUnit" Version="12.1.3" /><PackageReference Include="Avalonia.Themes.Fluent" Version="12.1.3" /><PackageReference Include="Avalonia.Fonts.Inter" Version="12.1.3" /><PackageReference Include="Microsoft.AspNetCore.Components.WebAssembly" Version="10.0.12" /><PackageReference Include="Microsoft.AspNetCore.Components.WebAssembly.DevServer" Version="10.0.12" /><PackageReference Include="Microsoft.CodeAnalysis.CSharp" Version="5.0.0" /></ItemGroup></Project>
          XML
          dotnet restore /tmp/host-inputs/Hosts.csproj
          tar -czf /tmp/host-packages.tar.gz -C /tmp host-packages
          split -b 380M /tmp/host-packages.tar.gz /tmp/host-cache-
          reference=$(ls "$DOTNET_ROOT/packs/Microsoft.AspNetCore.App.Ref" | grep '^10\.' | sort -V | tail -1)
          tar -czf /tmp/aspnet-reference.tar.gz -C "$DOTNET_ROOT" "packs/Microsoft.AspNetCore.App.Ref/$reference"
          ls -lh /tmp/host-cache-* /tmp/aspnet-reference.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: host-package-cache-aa
          compression-level: 0
          retention-days: 3
          path: /tmp/host-cache-aa
      - uses: actions/upload-artifact@v4
        with:
          name: host-package-cache-ab
          compression-level: 0
          retention-days: 3
          path: /tmp/host-cache-ab
      - uses: actions/upload-artifact@v4
        with:
          name: aspnet-reference
          compression-level: 0
          retention-days: 3
          path: /tmp/aspnet-reference.tar.gz
