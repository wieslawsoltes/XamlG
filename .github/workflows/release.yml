name: Release packages
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['eng/**', 'scripts/**', 'tests/**', 'src/**', 'tools/**', 'Directory.*', 'global.json', 'NuGet.Config', 'README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'docs/releasing.md', '.github/release.yml', '.github/workflows/release.yml', '.github/workflows/theme-corpus.yml', '.github/workflows/playground.yml']
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: 'Publish the existing GitHub release assets to NuGet using trusted publishing (requires the nuget environment and NUGET_USER).'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve version and enforce release ancestry
        id: identity
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PUBLISH_NUGET: ${{ inputs.publish_nuget }}
        run: python scripts/resolve-release-version.py
      - name: Verify release tooling
        run: python -m unittest discover -s scripts/tests -p 'test_release*.py' -v
  packages:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget) }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build and test shipping solution
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          dotnet build XamlG.slnx -c Release -warnaserror -p:Version="$RELEASE_VERSION" -p:PackageVersion="$RELEASE_VERSION" -p:ContinuousIntegrationBuild=true
          dotnet test XamlG.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/release-tests
      - name: Build and inspect all shipping packages
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/build-release.py --version "$RELEASE_VERSION" --no-build
      - name: Install and execute clean package consumers
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/test-release-packages.py --packages artifacts/release --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: artifacts/release-tests
  upstream:
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve pinned upstream revision
        id: pin
        run: |
          python - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          revision=ET.parse('tests/Upstream.props').findtext('.//XamlXRevision')
          assert re.fullmatch('[0-9a-f]{40}',revision)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('revision='+revision+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: AvaloniaUI/XamlX
          ref: ${{ steps.pin.outputs.revision }}
          path: external/XamlX
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: |
          dotnet test tests/XamlG.XamlX.Baseline.Tests -c Release -p:NuGetAudit=false --filter 'Category!=ParityRegression' --logger 'trx;LogFileName=Baseline.trx' --results-directory artifacts/upstream
          dotnet test tests/XamlG.XamlX.Compatibility.Tests -c Release -p:NuGetAudit=false --filter 'Category!=ParityRegression' --logger 'trx;LogFileName=Compatibility.trx' --results-directory artifacts/upstream
          python scripts/verify-test-results.py artifacts/upstream/Baseline.trx --expected 222
          python scripts/verify-test-results.py artifacts/upstream/Compatibility.trx --expected 217
          dotnet test tests/XamlG.XamlX.Baseline.Tests -c Release --no-build --filter Category=ParityRegression --logger 'trx;LogFileName=Baseline-parity.trx' --results-directory artifacts/upstream
          dotnet test tests/XamlG.XamlX.Compatibility.Tests -c Release --no-build --filter Category=ParityRegression --logger 'trx;LogFileName=Compatibility-parity.trx' --results-directory artifacts/upstream
          python scripts/verify-test-results.py artifacts/upstream/Baseline-parity.trx --expected 268
          python scripts/verify-test-results.py artifacts/upstream/Compatibility-parity.trx --expected 268
  themes:
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget)
    needs: prepare
    uses: ./.github/workflows/theme-corpus.yml
    permissions:
      contents: read
  browser:
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget)
    needs: prepare
    uses: ./.github/workflows/playground.yml
    permissions:
      contents: read
  github-release:
    if: startsWith(github.ref, 'refs/tags/v') && !(github.event_name == 'workflow_dispatch' && inputs.publish_nuget)
    needs: [packages, upstream, themes, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: release
      - name: Publish or verify the immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish-release.py --directory release
  nuget:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget && startsWith(github.ref, 'refs/tags/v')
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      # Reuse the exact assets that passed the tag's package/upstream/theme/browser
      # gates. Repacking on dispatch could give NuGet different bytes from GitHub.
      - name: Download the published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          gh release download "$RELEASE_TAG" --dir release
      - name: Verify release checksums, complete inventory and source commit
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/verify-release.py --directory release --version "$RELEASE_VERSION" --commit "$(git rev-parse HEAD)"
      - name: Check trusted publishing configuration
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: test -n "$NUGET_USER" || { echo 'Set the NUGET_USER secret in the nuget environment. See docs/releasing.md.'; exit 1; }
      - name: Obtain a short-lived NuGet API key using GitHub OIDC
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages and portable symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'release/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate --no-symbols
          dotnet nuget push 'release/*.snupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
