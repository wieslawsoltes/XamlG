name: Prepare workspace integration fixes
on:
  push:
    branches: [feat/msbuild-solution-workspaces]
    paths: [.github/workflows/workspace-integration-repair.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare audited source changes without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: python
        run: |
          import json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path('.')
          expected = os.environ['EXPECTED_HEAD']
          repository = os.environ['GITHUB_REPOSITORY']
          assert repository == 'wieslawsoltes/XamlG'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          assert api('/git/ref/heads/feat/msbuild-solution-workspaces')['object']['sha'] == expected
          changes = {}
          def replace(path, before, after):
              source = changes.get(path, (root / path).read_text())
              assert source.count(before) == 1, (path, before, source.count(before))
              changes[path] = source.replace(before, after)
          replace('tools/XamlG.Playground/App.razor', 'Mode="_solutionWizardMode"', 'Mode="@_solutionWizardMode"')
          replace('tools/XamlG.Playground/Workspaces/SolutionWorkspaceSession.cs',
              '_workspace = candidate;\n        SynchronizeCleanDocuments();',
              '_workspace = candidate;\n        SynchronizeCleanDocuments();\n        Inspect();')
          path = 'tools/XamlG.Playground/tests/solution-workspace.spec.mjs'
          for label in ['Solution format', 'Selected project', 'Project reference', 'Build target']:
              replace(path, "getByLabel('" + label + "', { exact: true })", "getByRole('combobox', { name: '" + label + "', exact: true })")
          replace(path, '    await create(page, pane, format, true);',
              '    await create(page, pane, format, true);\n    await expect.poll(() => sourceText(page, `WorkspaceDemo.${format}`)).toContain(\'Library.csproj\');\n    await expect(pane.locator(\'.ws-tree-row[title="Library/Library.csproj"]\')).toBeVisible();')
          for path, content in changes.items():
              (root / path).write_text(content)
          subprocess.run(['git', 'diff', '--check'], check=True)
          subprocess.run(['git', 'diff', '--stat'], check=True)
          subprocess.run(['git', 'diff'], check=True)
          base_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          tree = [{'path': path, 'mode': '100644', 'type': 'blob', 'content': content} for path, content in changes.items()]
          tree.append({'path': '.github/workflows/workspace-integration-repair.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          created_tree = api('/git/trees', {'base_tree': base_tree, 'tree': tree})['sha']
          commit = api('/git/commits', {'message': 'Fix solution wizard mode, project graph refresh and browser control selectors', 'tree': created_tree, 'parents': [expected]})
          pathlib.Path('prepared-commit.json').write_text(json.dumps({'parent': expected, 'commit': commit['sha'], 'tree': created_tree}, indent=2))
          print(pathlib.Path('prepared-commit.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Prepared commit `' + commit['sha'] + '` on `' + expected + '`. No branch was updated.\n')
          subprocess.run(['tar', '--exclude=.git', '--exclude=source.tar.gz', '-czf', 'source.tar.gz', '.'], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-workspace-integration
          path: |
            prepared-commit.json
            source.tar.gz
          retention-days: 7
