name: Workspace browser gate diagnostics
on:
  push:
    branches: [diagnostics/workspace-browser-58901]
permissions:
  contents: read
jobs:
  responsive-dock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8348cf3e396acf0f85fd9fa6cba94e71e02efd60
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Chromium test runner
        working-directory: tools/XamlG.Playground
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Exercise exact production docking CSS
        working-directory: tools/XamlG.Playground
        env:
          PLAYGROUND_URL: 'http://127.0.0.1:9/'
        run: npx playwright test dock-responsive.spec.mjs --retries=0
      - name: Summarize bounded test results
        if: always()
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('tools/XamlG.Playground/test-results/results.json')
          if path.exists():
              report = json.loads(path.read_text())
              print('RESPONSIVE DOCK:', json.dumps(report['stats']))
              for suite in report.get('suites', []):
                  for spec in suite.get('specs', []):
                      print(spec['title'], [test['status'] for test in spec['tests']])
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-dock-validation
          path: tools/XamlG.Playground/test-results
