name: Host integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: host-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  processes:
    name: CLI and LSP process contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Create an independent host worktree
        run: |
          git worktree add --detach "$RUNNER_TEMP/xamlg-hosts" HEAD
          echo "HOST_WORKTREE=$RUNNER_TEMP/xamlg-hosts" >> "$GITHUB_ENV"
      - name: Build the real hosts and their sample assemblies once
        run: |
          cd "$HOST_WORKTREE"
          dotnet restore XamlG.slnx -p:NuGetAudit=false
          dotnet build XamlG.slnx -c Release --no-restore -warnaserror
      - name: Run protocol and CLI acceptance suites
        run: |
          set -o pipefail
          cd "$HOST_WORKTREE"
          mkdir -p artifacts/hosts
          git rev-parse HEAD > artifacts/hosts/commit.txt
          git rev-parse HEAD^{tree} > artifacts/hosts/tree.txt
          scripts=(test-lsp-stdio.py test-lsp-process.py test-lsp-project.py test-lsp-resources.py test-lsp-csharp.py test-lsp-authoring.py test-lsp-pull-diagnostics.py test-lsp-file-refactoring.py test-cli-project.py test-cli-watch.py)
          failed=0
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            git hash-object "scripts/$script" | tee "artifacts/hosts/$script.sha"
            if ! python "scripts/$script" 2>&1 | tee "artifacts/hosts/$script.log"; then failed=1; fi
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Execute browser-component lifecycle tests without the browser toolchain
        if: ${{ !cancelled() && env.HOST_WORKTREE != '' }}
        run: |
          cd "$HOST_WORKTREE"
          dotnet test tests/XamlG.Playground.Tests -c Release -p:NuGetAudit=false --logger trx --results-directory artifacts/hosts/components
      - name: Exercise CLI check, inspection and source output on the sample
        run: |
          cd "$HOST_WORKTREE"
          dotnet run --project tools/XamlG.Cli --no-build -c Release -- check samples/XamlG.Sample/View.xaml -r samples/XamlG.Sample/bin/Release/net10.0/XamlG.Sample.dll
          dotnet run --project tools/XamlG.Cli --no-build -c Release -- inspect samples/XamlG.Sample/View.xaml -r samples/XamlG.Sample/bin/Release/net10.0/XamlG.Sample.dll > artifacts/hosts/inspect.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-process-validation
          path: ${{ env.HOST_WORKTREE }}/artifacts/hosts
      - name: Verify source was not modified and remove this job's worktree
        if: ${{ always() && env.HOST_WORKTREE != '' }}
        run: |
          git -C "$HOST_WORKTREE" diff --exit-code
          git -C "$HOST_WORKTREE" diff --cached --exit-code
          git worktree remove "$HOST_WORKTREE"
