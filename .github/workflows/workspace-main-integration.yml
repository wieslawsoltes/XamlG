name: Workspace main integration
on:
  push:
    branches: ['feat/msbuild-solution-workspaces']
    paths: ['.github/workflows/workspace-main-integration.yml']
permissions:
  contents: read
jobs:
  reconcile:
    if: github.repository == 'wieslawsoltes/XamlG' && github.ref == 'refs/heads/feat/msbuild-solution-workspaces'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '46c58c95de5bf2414c5e46cd8c8ed636c5b0cbd5'
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable merged tree without changing any branch
        shell: python
        env:
          SOURCE_HEAD: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, json, os, subprocess, urllib.request
          from pathlib import Path
          source = '46c58c95de5bf2414c5e46cd8c8ed636c5b0cbd5'
          main = '4599636974aaf37d547e136d4161dfe775df1059'
          head = os.environ['SOURCE_HEAD']
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/wieslawsoltes/XamlG' + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          if api('/git/ref/heads/feat/msbuild-solution-workspaces')['object']['sha'] != head:
              raise RuntimeError('The feature branch changed; refusing stale integration.')
          if api('/git/ref/heads/main')['object']['sha'] != main:
              raise RuntimeError('The target branch changed; refusing stale integration.')
          git('config', 'user.name', 'Wiesław Šoltés')
          git('config', 'user.email', 'wieslawsoltes@users.noreply.github.com')
          result = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', main], text=True)
          allowed = {
              'tools/XamlG.Playground/App.Dockyard.cs',
              'tools/XamlG.Playground/App.razor',
              'tools/XamlG.Playground/App.razor.cs',
              'tools/XamlG.Playground/wwwroot/startup.js'
          }
          conflicts = set(git('diff', '--name-only', '--diff-filter=U').splitlines())
          if result.returncode not in (0, 1) or not conflicts.issubset(allowed):
              raise RuntimeError('Unexpected conflicts: ' + repr(sorted(conflicts)))
          def read(path):
              return subprocess.check_output(['git', 'show', source + ':' + path]).decode('utf-8')
          def replace(text, old, new):
              if text.count(old) != 1:
                  raise RuntimeError('Expected one integration anchor: ' + old)
              return text.replace(old, new)
          def write(path, text):
              Path(path).write_bytes(text.encode('utf-8'))
              git('add', '--', path)
          path = 'tools/XamlG.Playground/App.Dockyard.cs'
          text = read(path)
          text = replace(text, '        new("agent", "Coding agent", "Right"),',
              '        new("git-repositories", "Git repositories", "Left", DefaultOpen: false),\n'
              '        new("git-changes", "Git changes", "Right", DefaultOpen: false),\n'
              '        new("git-branches", "Git branches and stashes", "Left", DefaultOpen: false),\n'
              '        new("git-history", "Git history", DefaultOpen: false),\n'
              '        new("git-github", "GitHub", "Right", DefaultOpen: false),\n'
              '        new("agent", "Coding agent", "Right"),')
          text = replace(text, 'PaneTemplate(template is "explorer"',
              'PaneTemplate(template == "git-document" ? "git-document" : template.StartsWith("git-", StringComparison.Ordinal) ? "git-tool" : template is "explorer"')
          text = replace(text, '.Concat(AllDocumentIds()).ToArray();', '.Concat(AllDocumentIds()).Concat(_gitDocuments.Keys).ToArray();')
          write(path, text)
          path = 'tools/XamlG.Playground/App.razor'
          text = read(path)
          text = replace(text, '<link rel="stylesheet" href="runtime-workbench.css" />',
              '<link rel="stylesheet" href="runtime-workbench.css" />\n<link rel="stylesheet" href="git/workbench.css" />')
          button = '        <button @onclick=\'() => ShowPaneAsync("agent")\''
          text = replace(text, button,
              '        <button @onclick=\'() => ShowPaneAsync("git-repositories")\' disabled="@(!_dockReady)" data-testid="git-workbench">Git</button>\n' + button)
          anchor = '    <BrowserTemplate TItem="JsonElement" Id="@PaneTemplate("document")" Context="pane">'
          templates = '\n'.join([
              '    <BrowserTemplate TItem="JsonElement" Id="@PaneTemplate("git-tool")" Context="pane">',
              '        <GitTool SessionId="@_panePrefix" Kind="@(pane.GetProperty("ContentId").GetString()!)" OpenRequested="OpenGitDocumentAsync" />',
              '    </BrowserTemplate>',
              '    <BrowserTemplate TItem="JsonElement" Id="@PaneTemplate("git-document")" Context="pane">',
              '        @if (_gitDocuments.TryGetValue(pane.GetProperty("ContentId").GetString()!, out var gitDocument))',
              '        {',
              '            <GitDocument @key="gitDocument.Id" SessionId="@_panePrefix" DocumentId="@gitDocument.Id"',
              '                OpenRequested="OpenGitDocumentAsync" ImportRequested="ImportGitSourceAsync" ReadStudioRequested="ReadStudioSourceAsync" />',
              '        }',
              '    </BrowserTemplate>', ''
          ])
          write(path, replace(text, anchor, templates + anchor))
          path = 'tools/XamlG.Playground/App.razor.cs'
          write(path, replace(read(path), '        RetireDocumentBuffers();', '        RetireDocumentBuffers();\n        await DisposeGitAsync();'))
          path = 'tools/XamlG.Playground/wwwroot/startup.js'
          write(path, replace(read(path), "'solution-workspace.js']);", "'solution-workspace.js', 'git/workbench.mjs']);"))
          for path in ('.github/workflows/workspace-main-integration.yml', '.github/workflows/workspace-integration-repair.yml'):
              if Path(path).exists():
                  git('rm', '--', path)
          if git('diff', '--name-only', '--diff-filter=U'):
              raise RuntimeError('Unresolved merge entries remain.')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          local_tree = git('write-tree')
          paths = git('diff', '--name-only', main, local_tree).splitlines()
          entries = []
          for path in paths:
              if not Path(path).is_file():
                  entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': None})
                  continue
              # Only create immutable blobs/trees. No ref update, push, PR change
              # or merge is performed by this preparation job.
              content = Path(path).read_bytes()
              blob = api('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          main_tree = api('/git/commits/' + main)['tree']['sha']
          tree = api('/git/trees', {'base_tree': main_tree, 'tree': entries})['sha']
          if tree != local_tree:
              raise RuntimeError('Remote tree identity differs from the reviewed local merge.')
          print(json.dumps({'tree': tree, 'source_parent': head, 'main_parent': main, 'changed_paths': paths}, indent=2), flush=True)
