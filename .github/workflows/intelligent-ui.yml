name: Intelligent UI
on:
  pull_request:
    paths:
      - 'src/XamlG.IntelligentUI*/**'
      - 'src/XamlG.Automation/**'
      - 'src/XamlG.Mcp/**'
      - 'src/XamlG.Agents/**'
      - 'tools/XamlG.Playground/**'
      - 'tests/XamlG.IntelligentUI.Tests/**'
      - '.github/workflows/intelligent-ui.yml'
      - 'XamlG.slnx'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: intelligent-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore dependencies
        run: |
          mkdir -p artifacts/intelligent-ui
          dotnet restore XamlG.slnx
          dotnet restore tests/XamlG.IntelligentUI.Tests
          dotnet restore tools/XamlG.Playground -p:WasmBuildNative=false
      - name: Capture offline browser package feed
        if: github.head_ref == 'codex/intelligent-ui'
        run: |
          cd "$HOME/.nuget/packages"
          find . -name '*.nupkg' -print0 | tar --null -T - -czf "$GITHUB_WORKSPACE/artifacts/intelligent-ui/packages.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'codex/intelligent-ui'
        with:
          name: intelligent-ui-browser-packages
          path: artifacts/intelligent-ui/packages.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Build native contracts
        run: dotnet build XamlG.slnx -c Release --no-restore -warnaserror 2>&1 | tee artifacts/intelligent-ui/build.log
      - name: Test native contracts
        run: dotnet test XamlG.slnx -c Release --no-build --logger 'trx;LogFilePrefix=intelligent-ui' --results-directory artifacts/intelligent-ui/tests 2>&1 | tee artifacts/intelligent-ui/tests.log
      - name: Test intelligent UI
        run: dotnet test tests/XamlG.IntelligentUI.Tests -c Release --no-restore -warnaserror --logger 'trx;LogFilePrefix=ui' --results-directory artifacts/intelligent-ui/tests 2>&1 | tee artifacts/intelligent-ui/ui-tests.log
      - name: Build browser managed integration
        run: dotnet build tools/XamlG.Playground -c Release --no-restore -p:WasmBuildNative=false -warnaserror 2>&1 | tee artifacts/intelligent-ui/browser-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligent-ui-test-results
          path: |
            artifacts/intelligent-ui/*.log
            artifacts/intelligent-ui/tests
          if-no-files-found: ignore
          retention-days: 7
