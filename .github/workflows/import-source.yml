name: Import verified source
on:
  push:
    branches: [main]
    paths: ['.bootstrap/import.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xamlg-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize source tree
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path, PurePosixPath
          root = Path.cwd()
          manifest = json.loads((root / '.bootstrap/import.json').read_text())
          encoded = ''.join((root / '.bootstrap' / name).read_text().strip() for name in manifest['parts'])
          archive = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(archive).hexdigest() != manifest['sha256']:
              raise RuntimeError('Source archive digest mismatch')
          payload = gzip.decompress(archive)
          if len(payload) > 8_000_000:
              raise RuntimeError('Source archive exceeds the import bound')
          change = json.loads(payload)
          if len(change['files']) != manifest['files']:
              raise RuntimeError('Source file count mismatch')
          pending = []
          for entry in change['files']:
              relative = PurePosixPath(entry['path'])
              if relative.is_absolute() or '..' in relative.parts or any(p in {'.git', '.github', '.bootstrap', 'bin', 'obj'} for p in relative.parts):
                  raise RuntimeError(f'Invalid source path: {relative}')
              path = root / relative
              if not path.resolve().is_relative_to(root):
                  raise RuntimeError('Source path escapes checkout')
              content = base64.b64decode(entry['content'], validate=True) if entry.get('encoding') == 'base64' else entry['content'].encode('utf-8')
              old = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
              if old != entry.get('previous') and old != hashlib.sha256(content).hexdigest():
                  raise RuntimeError(f'Concurrent source change detected: {relative}')
              pending.append((path, content))
          for path, content in pending:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(content)
          (root / '.git/import-message').write_text(change['message'])
          print(f'Materialized {len(pending)} verified source files')
          PY
      - name: Commit implementation
        run: |
          git add --all
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -F .git/import-message
            git push origin HEAD:main
          fi
