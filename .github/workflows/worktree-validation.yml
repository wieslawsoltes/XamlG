name: Parallel worktree validation
on:
  push:
    branches: [main, feat/worktree-completion]
    paths: ['src/**', 'tests/**', 'tools/**', 'Directory.*', '.github/workflows/worktree-validation.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worktrees-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: compiler
            projects: 'tests/XamlG.Tests tests/XamlG.Avalonia.Tests'
          - job: designer
            projects: 'tests/XamlG.Tooling.Tests'
          - job: hosts
            projects: 'tests/XamlG.Workspaces.Tests tests/XamlG.LanguageServer.Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Create isolated source and build directories
        env:
          JOB_NAME: ${{ matrix.job }}
        run: |
          worktree="$RUNNER_TEMP/xamlg-$JOB_NAME"
          git worktree add --detach "$worktree" HEAD
          echo "WORKTREE=$worktree" >> "$GITHUB_ENV"
          git -C "$worktree" rev-parse HEAD
          git worktree list --porcelain
      - name: Execute the complete job scope
        env:
          PROJECTS: ${{ matrix.projects }}
          JOB_NAME: ${{ matrix.job }}
        run: |
          cd "$WORKTREE"
          for project in $PROJECTS; do
            dotnet test "$project" -c Release -p:NuGetAudit=false --logger trx --results-directory "$GITHUB_WORKSPACE/artifacts/$JOB_NAME"
          done
      - name: Preserve exact public framework input for offline reproduction
        if: matrix.job == 'compiler'
        run: |
          mkdir -p artifacts/offline
          tar -czf artifacts/offline/framework-theme.tar.gz -C "$HOME/.nuget/packages" avalonia.themes.simple/12.1.3
      - uses: actions/upload-artifact@v4
        if: matrix.job == 'compiler'
        with:
          name: offline-framework-theme
          path: artifacts/offline/framework-theme.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worktree-${{ matrix.job }}
          path: artifacts/${{ matrix.job }}
      - name: Remove only this job's clean worktree
        if: always()
        run: |
          if [ -n "$WORKTREE" ] && [ -d "$WORKTREE" ]; then
            git -C "$WORKTREE" diff --exit-code
            git worktree remove "$WORKTREE"
          fi
