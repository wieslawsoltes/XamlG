name: Restore verified checkpoint
on:
  push:
    paths: ['.github/workflows/restore-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: checkpoint-restore
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Materialize bounded complete source records
        run: |
          python - <<'PY'
          import base64, hashlib, json, subprocess, zlib
          from pathlib import Path, PurePosixPath
          parts=sorted(Path('.bootstrap').glob('checkpoint-01-*.b64'))
          encoded=''.join(p.read_text().strip() for p in parts)
          encoded=encoded[:len(encoded)//4*4]
          data=base64.b64decode(encoded,validate=True)
          if hashlib.sha256(data).hexdigest()!='9f1632edf4fca2cf75e417cb1dd2a63666e22f61e50173307784492b714eff13': raise RuntimeError('Checkpoint changed since audit')
          raw=zlib.decompressobj(31).decompress(data,16_000_001).decode('utf8')
          decoder=json.JSONDecoder(); position=raw.index('[')+1; entries=[]
          while position<len(raw):
              while position<len(raw) and raw[position] in ', \r\n\t': position+=1
              try: entry,position=decoder.raw_decode(raw,position)
              except json.JSONDecodeError: break
              entries.append(entry)
          if len(entries)!=16: raise RuntimeError('Recovery boundary differs from audited source')
          for entry in entries:
              path=PurePosixPath(entry['path'])
              if path.is_absolute() or '..' in path.parts or path.parts[0]!='src' or path.suffix!='.cs': raise RuntimeError('Invalid source path')
              target=Path(path); target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(entry['content'],encoding='utf8',newline='')
              print('RESTORED',path)
          path=Path('src/XamlG.Syntax/NamespaceScope.cs')
          if subprocess.check_output(['git','hash-object',str(path)],text=True).strip()!='fcabc3d5e0b8ae5c378d8e1b016cf921bd1d5efd': raise RuntimeError('Namespace source changed')
          source=path.read_text()
          pairs=[
            ('bool preserve)\n','bool preserve, ImmutableHashSet<string>? declared = null)\n'),
            ('PreserveSpace = preserve; }','PreserveSpace = preserve; DeclaredPrefixes = declared ?? ImmutableHashSet<string>.Empty.WithComparer(StringComparer.Ordinal); }'),
            ('    public bool PreserveSpace { get; }','    public bool PreserveSpace { get; }\n    public ImmutableHashSet<string> DeclaredPrefixes { get; }'),
            ('var preserve = PreserveSpace;','var preserve = PreserveSpace; var declared = DeclaredPrefixes;'),
            ('if (a.IsNamespace) bindings = bindings.SetItem(a.Name == "xmlns" ? string.Empty : a.Name.Substring(6), a.Value);','if (a.IsNamespace) { var prefix = a.Name == "xmlns" ? string.Empty : a.Name.Substring(6); bindings = bindings.SetItem(prefix, a.Value); declared = declared.Add(prefix); }'),
            ('var result = new NamespaceScope(bindings, ignored, preserve);','var result = new NamespaceScope(bindings, ignored, preserve, declared);'),
            ('return new NamespaceScope(bindings, ignored, preserve);','return new NamespaceScope(bindings, ignored, preserve, declared);')]
          for before,after in pairs:
              if source.count(before)!=1: raise RuntimeError('Namespace patch conflict: '+before)
              source=source.replace(before,after,1)
          path.write_text(source,encoding='utf8',newline='')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build and execute recovered compiler
        run: |
          dotnet build src/XamlG.Generator/XamlG.Generator.csproj -c Release -p:NuGetAudit=false
          dotnet test tests/XamlG.Tests/XamlG.Tests.csproj -c Release -p:NuGetAudit=false --logger 'trx;LogFileName=compiler.trx' --results-directory artifacts/tests
      - name: Commit verified source
        run: |
          git add src
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: restore typed dynamic setters and namespace projections with validated compiler source'
          git push origin HEAD:main
          git rev-parse HEAD
      - name: Verify package integration on committed revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: restored-compiler-validation
          path: artifacts/tests
          retention-days: 7
