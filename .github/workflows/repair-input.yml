name: Repair source transport
on:
  push:
    paths: ['.github/workflows/repair-input.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: xamlg-source-transactions
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair only the verified transport defects
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          first = Path('.bootstrap/patches/006-emission-operations.json')
          second = Path('.bootstrap/patches/007-emission-tests.json')
          def assert_hash(path, expected):
              actual = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
              if actual != expected: raise RuntimeError(f'Concurrent modification: {path}: {actual}')
          assert_hash(first, '0ce95a996ed389b40fb150682bd5fb953ea4a564')
          assert_hash(second, '1320ea9daa5e815bcfe64f171846d14230693c2a')
          text = first.read_text()
          for name in ('value', 'assignment'):
              old = '" + ' + name + '.GetType().Name + "'
              new = '\\" + ' + name + '.GetType().Name + \\"'
              if text.count(old) != 1: raise RuntimeError(f'Expected one damaged diagnostic for {name}')
              text = text.replace(old, new, 1)
          json.loads(text)
          first.write_text(text)
          transaction = json.loads(second.read_text())
          fixture = next(f for f in transaction['files'] if f['path'] == 'tests/XamlG.Tests/EmissionTests.cs')
          replacements = [
              ('public Window() { InitializeComponent(); }', 'public Window() { }'),
              ('var root = Activator.CreateInstance(code.Assembly.GetType("Fixture.Window")!)!;', 'var root = Activator.CreateInstance(code.Assembly.GetType("Fixture.Window")!)!; root.GetType().GetMethod("InitializeComponent", System.Reflection.BindingFlags.Instance | System.Reflection.BindingFlags.NonPublic)!.Invoke(root, null);')
          ]
          for old, new in replacements:
              if fixture['content'].count(old) != 1: raise RuntimeError('Execution fixture changed concurrently')
              fixture['content'] = fixture['content'].replace(old, new, 1)
          second.write_text(json.dumps(transaction, ensure_ascii=False))
          subprocess.run(['git', 'add', '--force', str(first), str(second)], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix: repair source transport escaping and standalone execution fixtures'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          PY
      - name: Validate repaired source in the normal pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run development.yml --ref main
